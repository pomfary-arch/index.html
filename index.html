<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة علي جاسم - غزو الدول</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: Tahoma, sans-serif;
            overflow: hidden;
            text-align: center;
        }
        #header {
            padding: 15px;
            background: #1e293b;
            border-bottom: 2px solid #3b82f6;
            font-size: 18px;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
        }
        .map-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }
        .country {
            flex: 1;
            height: 150px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            border: 3px solid rgba(255,255,255,0.2);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .country:active { transform: scale(0.95); }
        
        /* ألوان الدول */
        .player-country { background: #3b82f6; border-color: #93c5fd; }
        .enemy-country { background: #ef4444; border-color: #fca5a5; }
        .neutral-country { background: #64748b; border-color: #cbd5e1; }

        .country-title { font-size: 14px; margin-bottom: 5px; opacity: 0.9; }
        .army-count { font-size: 24px; color: #fff; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 20px; }

        #controls {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            border: 1px solid #475569;
        }
        .attack-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .attack-btn:active { background: #059669; }
        #status-msg { font-size: 13px; color: #cbd5e1; margin-top: 8px; }
    </style>
</head>
<body>

    <div id="header">🌍 لعبة علي جاسم - حرب غزو الدول</div>

    <div id="game-container">
        <!-- الخريطة والدول -->
        <div class="map-grid">
            <!-- دولة اللاعب -->
            <div class="country player-country" onclick="selectCountry('player')">
                <div class="country-title">قاعدة علي جاسم</div>
                <div class="army-count" id="player-army">30</div>
            </div>

            <!-- دولة العدو -->
            <div class="country enemy-country" onclick="selectCountry('enemy')">
                <div class="country-title">دولة العدو</div>
                <div class="army-count" id="enemy-army">25</div>
            </div>
        </div>

        <div style="width: 100%;">
            <div class="country neutral-country" style="margin: 0 auto; max-width: 180px; height: 110px;" onclick="selectCountry('neutral')">
                <div class="country-title">منطقة محايدة</div>
                <div class="army-count" id="neutral-army">15</div>
            </div>
        </div>

        <!-- لوحة الأوامر والهجوم -->
        <div id="controls">
            <div id="status-msg">اختر الدولة المستهدفة للهجوم واضغط شن الهجوم!</div>
            <button class="attack-btn" onclick="launchAttack()">⚔️ شن الهجوم العسكري</button>
        </div>
    </div>

    <script>
        let playerArmy = 30;
        let enemyArmy = 25;
        let neutralArmy = 15;
        
        let selectedTarget = 'enemy'; // الهدف الافتراضي

        function updateUI() {
            document.getElementById('player-army').textContent = playerArmy;
            document.getElementById('enemy-army').textContent = enemyArmy;
            document.getElementById('neutral-army').textContent = neutralArmy;
        }

        // زيادة جيش اللاعب تلقائياً مع مرور الوقت (مثل محرك اللعبة الأصلية)
        setInterval(() => {
            if (playerArmy < 100) {
                playerArmy += 1;
                updateUI();
            }
        }, 1500);

        function selectCountry(target) {
            selectedTarget = target;
            const msg = document.getElementById('status-msg');
            if (target === 'enemy') {
                msg.textContent = "🎯 تم اختيار: دولة العدو للهجوم عليها!";
            } else if (target === 'neutral') {
                msg.textContent = "🎯 تم اختيار: المنطقة المحايدة لاحتلالها!";
            } else {
                msg.textContent = "⚠️ لا يمكنك الهجوم على قاعدتك الخاصة!";
            }
        }

        function launchAttack() {
            const msg = document.getElementById('status-msg');
            
            if (selectedTarget === 'enemy') {
                if (playerArmy > enemyArmy) {
                    playerArmy -= enemyArmy;
                    enemyArmy = 0;
                    msg.textContent = "🎉 مبروك يا علي! تم اجتياح وغزو دولة العدو بنجاح!";
                    document.querySelector('.enemy-country').style.background = '#3b82f6'; // تصبح للسيادة
                } else {
                    msg.textContent = "❌ فشل الهجوم! جيش العدو كان أقوى، تراجع وحدّث جيشك.";
                    playerArmy = Math.max(0, playerArmy - enemyArmy);
                }
            } else if (selectedTarget === 'neutral') {
                if (playerArmy > neutralArmy) {
                    playerArmy -= neutralArmy;
                    neutralArmy = 0;
                    msg.textContent = "✨ تم السيطرة على المنطقة المحايدة وتوسيع نفوذك!";
                    document.querySelector('.neutral-country').style.background = '#3b82f6';
                } else {
                    msg.textContent = "❌ جيشك غير كافٍ لاحتلال المنطقة المحايدة!";
                }
            } else {
                msg.textContent = "⚠️ اختر هدفاً خارجياً للهجوم عليه أولاً!";
            }
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
