<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة علي جاسم الاستراتيجية</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 0;
            background: #12121c;
            color: #fff;
            font-family: Tahoma, sans-serif;
            overflow: hidden;
        }
        /* شريط الموارد العلوي */
        #header-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 35, 0.95);
            display: flex;
            justify-content: space-around;
            padding: 12px 5px;
            border-bottom: 2px solid #e67e22;
            z-index: 100;
            font-size: 14px;
            font-weight: bold;
        }
        .resource {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .gold { color: #f1c40f; }
        .elixir { color: #9b59b6; }

        /* ساحة القرية */
        #game-board {
            position: absolute;
            top: 55px;
            bottom: 70px;
            left: 0;
            right: 0;
            background: #1b263b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .village-hub {
            background: #0f172a;
            border: 3px solid #3b82f6;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        .village-hub h2 { margin: 5px 0 10px 0; color: #60a5fa; font-size: 18px; }
        
        #battle-log {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            width: 90%;
            max-width: 350px;
            height: 90px;
            overflow-y: auto;
            font-size: 12px;
            text-align: right;
            color: #cbd5e1;
        }

        /* شريط الأزرار السفلي للتحكم والتدريب والهجوم */
        #footer-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.98);
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 2px solid #334155;
            z-index: 100;
        }
        .action-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #64748b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            margin: 0 4px;
            text-align: center;
            transition: 0.1s;
        }
        .action-btn:active { background: #3b82f6; }
    </style>
</head>
<body>

    <!-- شريط الموارد -->
    <div id="header-bar">
        <div class="resource gold">💰 الذهب: <span id="gold-count">500</span></div>
        <div class="resource elixir">🧪 الإكسير: <span id="elixir-count">300</span></div>
        <div class="resource">🛡️ الجيش: <span id="army-count">0</span>/20</div>
    </div>

    <!-- ساحة اللعب والقرية -->
    <div id="game-board">
        <div class="village-hub">
            <h2>🏰 قرية القائد علي جاسم</h2>
            <p>مستوى القرية (Town Hall): <span id="th-level">1</span></p>
            <p>الجنود الجاهزون: <span id="troops-ready">0</span> جندي</p>
        </div>

        <div id="battle-log">
            [سجل الأحداث]: أهلاً بك يا قائد علي في قريتك الجديدة! ابدأ بجمع الموارد وتدريب الجيش.
        </div>
    </div>

    <!-- الأزرار السفلية للتحكم بالهاتف -->
    <div id="footer-controls">
        <button class="action-btn" onclick="collectResources()">جمع الموارد</button>
        <button class="action-btn" onclick="trainTroop()">تدريب جندي</button>
        <button class="action-btn" onclick="upgradeTH()">ترقية التاون</button>
        <button class="action-btn" style="background: #b91c1c; border-color: #ef4444;" onclick="startAttack()">هجوم!</button>
    </div>

    <script>
        let gold = 500;
        let elixir = 300;
        let armyCount = 0;
        let thLevel = 1;
        let troopsReady = 0;

        const maxArmy = 20;

        function updateUI() {
            document.getElementById('gold-count').textContent = gold;
            document.getElementById('elixir-count').textContent = elixir;
            document.getElementById('army-count').textContent = armyCount;
            document.getElementById('th-level').textContent = thLevel;
            document.getElementById('troops-ready').textContent = troopsReady;
        }

        function logMessage(msg) {
            const logBox = document.getElementById('battle-log');
            logBox.innerHTML += `<br>${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // جمع الموارد تلقائياً كل ثانية وبشكل يدوي
        setInterval(() => {
            gold += thLevel * 5;
            elixir += thLevel * 3;
            updateUI();
        }, 2000);

        function collectResources() {
            gold += 50;
            elixir += 30;
            updateUI();
            logMessage("✨ تم جمع موارد إضافية بنجاح.");
        }

        function trainTroop() {
            if (elixir >= 25 && armyCount < maxArmy) {
                elixir -= 25;
                armyCount++;
                troopsReady++;
                updateUI();
                logMessage("⚔️ تم تدريب جندي جديد بنجاح.");
            } else if (armyCount >= maxArmy) {
                logMessage("⚠️ معسكر الجيش ممتلئ بالكامل!");
            } else {
                logMessage("❌ لا توجد كمية كافية من الإكسير للتدريب!");
            }
        }

        function upgradeTH() {
            let cost = thLevel * 300;
            if (gold >= cost) {
                gold -= cost;
                thLevel++;
                updateUI();
                logMessage(`🎉 مبروك! تم ترقية مبنى القرية إلى المستوى ${thLevel}.`);
            } else {
                logMessage(`❌ تحتاج إلى ${cost} ذهب لترقية التاون.`);
            }
        }

        function startAttack() {
            if (troopsReady > 0) {
                let lootedGold = troopsReady * 40;
                let lootedElixir = troopsReady * 30;
                gold += lootedGold;
                elixir += lootedElixir;
                logMessage(`🔥 شنق هجوم ناجح! غنمت ${lootedGold} ذهب و ${lootedElixir} إكسير.`);
                armyCount -= troopsReady;
                troopsReady = 0;
                updateUI();
            } else {
                logMessage("❌ جيشك فارغ! قم بتدريب جنود أولاً قبل شن الهجوم.");
            }
        }
    </script>
</body>
</html>
