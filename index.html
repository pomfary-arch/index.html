<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة اتصال حجي علي AI</title>
    <style>
        body { background: #0f172a; color: white; font-family: Tahoma; padding: 20px; text-align: center; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; }
        input { width: 70%; }
        button { background: #0284c7; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 8px; text-align: right; }
    </style>
</head>
<body>
    <h2>اختبار اتصال حجي علي AI 🤖</h2>
    <input type="text" id="q" placeholder="اكتب سؤالك هنا...">
    <button onclick="testAI()">إرسال</button>
    <div id="result">النتيجة ستظهر هنا...</div>

    <script>
        const API_KEY = "AQ.Ab8RN6I8CduQOS4QpTEzeVmMey5o0YnJhXQGFNajmycOd8slXA";

        async function testAI() {
            const query = document.getElementById("q").value;
            const resDiv = document.getElementById("result");
            resDiv.innerHTML = "جاري الاتصال...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: query }] }]
                    })
                });

                const data = await response.json();
                if(data.error) {
                    resDiv.innerHTML = "خطأ من جوجل: " + data.error.message;
                } else {
                    resDiv.innerHTML = data.candidates[0].content.parts[0].text;
                }
            } catch (err) {
                resDiv.innerHTML = "خطأ شبكة: " + err.message;
            }
        }
    </script>
</body>
</html>
