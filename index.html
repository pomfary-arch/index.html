<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجي علي AI - Google Gemini Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
        
        header { background: #1e1f20; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333538; }
        header h1 { font-size: 1.2rem; color: #8ab4f8; display: flex; align-items: center; gap: 8px; }
        
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 1rem; word-wrap: break-word; }
        .user-message { background: #004a77; color: #ffffff; align-self: flex-start; border-bottom-right-radius: 4px; }
        .ai-message { background: #1e1f20; color: #e3e3e3; align-self: flex-end; border-bottom-left-radius: 4px; border: 1px solid #333538; }
        
        .memory-box { background: #1e1f20; padding: 10px 20px; border-top: 1px solid #333538; max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
        .memory-box textarea { width: 100%; height: 40px; background: #131314; border: 1px solid #444746; border-radius: 8px; color: white; padding: 8px; font-size: 0.85rem; resize: none; outline: none; }
        .memory-box button { background: #1a73e8; color: white; border: none; padding: 6px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .memory-box button:hover { background: #1557b0; }

        .input-area { background: #1e1f20; padding: 15px 20px; display: flex; gap: 10px; border-top: 1px solid #333538; max-width: 800px; width: 100%; margin: 0 auto; }
        .input-area input { flex: 1; background: #131314; border: 1px solid #444746; border-radius: 24px; padding: 12px 20px; color: white; font-size: 1rem; outline: none; }
        .input-area input:focus { border-color: #8ab4f8; }
        .input-area button { background: #8ab4f8; color: #131314; border: none; width: 45px; height: 45px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <h1>✨ حجي علي AI <span style="font-size: 0.75rem; background: #282a2c; padding: 3px 8px; border-radius: 4px; color: #8ab4f8;">Gemini Engine</span></h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">أهلاً بك يا علي! أنا عقل جيمناي المتطور، جاهز لنقاشاتك، وأفكارك، ولتعلمني كل ما تريد. تفضل!</div>
    </div>

    <!-- نافذة الذاكرة الذكية -->
    <div class="memory-box">
        <textarea id="memoryInput" placeholder="علّم حجي علي شيئاً جديداً ليبقى محفوظاً في ذاكرته الدائمة..."></textarea>
        <button onclick="saveMemory()">حفظ في الذاكرة 🧠</button>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اسأل حجي علي أي شيء..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">⬆</button>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6I8CduQOS4QpTEzeVmMey5o0YnJhXQGFNajmycOd8slXA";
        
        let customMemory = localStorage.getItem("hajiAliMemory") || "أنت مساعد ذكي شخصي لـ علي جاسم، فصيح وذكي وتتحدث بأسلوب احترافي وودود.";
        document.getElementById("memoryInput").value = customMemory;

        function saveMemory() {
            customMemory = document.getElementById("memoryInput").value;
            localStorage.setItem("hajiAliMemory", customMemory);
            alert("تم تحديث ذاكرة وتوجيهات المساعد بنجاح! 🧠");
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chatContainer");
            const text = inputField.value.trim();
            
            if (!text) return;

            chatContainer.innerHTML += `<div class="message user-message">${text}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = "loading_" + Date.now();
            chatContainer.innerHTML += `<div class="message ai-message" id="${loadingId}">جاري التفكير بسرعة فائقة... ⚡</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const combinedPrompt = `[تعليمات النظام والذاكرة الخاصة بالمستخدم]:\n${customMemory}\n\n[سؤال المستخدم الحالي]:\n${text}`;

                // الاتصال المباشر بنموذج جيمناي القوي والاستقرار التام
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: combinedPrompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiMessage = data.candidates?.[0]?.content?.parts?.[0]?.text || "عذراً، لم أستطع توليد إجابة.";

                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message ai-message">${aiMessage}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message ai-message">حدث خطأ تقني: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
