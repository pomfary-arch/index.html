<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المغامرة ثلاثية الأبعاد</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Tahoma, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 20px;
            border: 2px solid #4ecca3;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
    </style>
    <!-- استدعاء مكتبة Three.js الشهيرة للرسومات ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">النقاط: <span id="score">0</span></div>
    <div id="controls-hint">استخدم أزرار <strong>W, A, S, D</strong> أو الأسهم للحركة، وزر <strong>المسافة (Space)</strong> للقفز!</div>

    <script>
        // إعداد المشهد والكاميرا والمحرك الرسومي
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة خفيفة في العالم
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(0, 20, 10);
        scene.add(pointLight);

        // أرضية المشهد (المكان الذي نمشي عليه)
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x16213e, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // بناء اللاعب (مكعب يمثل الشخصية)
        const playerGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x4ecca3 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.75, 0);
        scene.add(player);

        // إضافة أهداف نجمعها في العالم (كرات ذهبية مضيئة)
        const collectibles = [];
        const collectibleGeo = new THREE.SphereGeometry(0.6, 16, 16);
        const collectibleMat = new THREE.MeshStandardMaterial({ color: 0xf39c12, emissive: 0xf39c12 });

        for (let i = 0; i < 15; i++) {
            const coin = new THREE.Mesh(collectibleGeo, collectibleMat);
            coin.position.set(
                (Math.random() - 0.5) * 60,
                0.6,
                (Math.random() - 0.5) * 60
            );
            scene.add(coin);
            collectibles.push(coin);
        }

        // متغيرات الحركة والتحكم
        let score = 0;
        const keys = {};
        let playerVelocityY = 0;
        const gravity = 0.015;
        let isJumping = false;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // حلقة اللعبة والتحديث المستمر
        function animate() {
            requestAnimationFrame(animate);

            // حركة اللاعب عبر الكيبورد
            const speed = 0.2;
            if (keys['w'] || keys['arrowup']) player.position.z -= speed;
            if (keys['s'] || keys['arrowdown']) player.position.z += speed;
            if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
            if (keys['d'] || keys['arrowright']) player.position.x += speed;

            // القفز والجاذبية
            if ((keys[' '] || keys['arrowup']) && !isJumping && player.position.y <= 0.75) {
                playerVelocityY = 0.3;
                isJumping = true;
            }

            player.position.y += playerVelocityY;
            if (player.position.y > 0.75) {
                playerVelocityY -= gravity;
            } else {
                player.position.y = 0.75;
                playerVelocityY = 0;
                isJumping = false;
            }

            // تتبع الكاميرا للاعب (تتحرك معه وكأنها خلفه ومنظور رؤية)
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 6;
            camera.position.z = player.position.z + 10;
            camera.lookAt(player.position.x, player.position.y, player.position.z);

            // فحص اصطدام اللاعب بالنقاط وجمعها
            collectibles.forEach((coin, index) => {
                // دوران جمالي للعملات
                coin.rotation.y += 0.03;

                // حساب المسافة للاصطدام
                const distance = player.position.distanceTo(coin.position);
                if (distance < 1.5) {
                    scene.remove(coin);
                    collectibles.splice(index, 1);
                    score += 10;
                    document.getElementById('score').textContent = score;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        // التكيف مع حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
