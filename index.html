<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجي علي AI - المساعد الذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.4rem; color: #38bdf8; }
        header p { font-size: 0.8rem; color: #94a3b8; margin-top: 3px; }
        
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .user-message { background: #0284c7; color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
        .ai-message { background: #334155; color: #f8fafc; align-self: flex-end; border-bottom-left-radius: 2px; border: 1px solid #475569; }
        
        .memory-box { background: #1e293b; padding: 10px 15px; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .memory-box textarea { width: 100%; height: 50px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: white; padding: 8px; font-size: 0.85rem; resize: none; }
        .memory-box button { background: #0d9488; color: white; border: none; padding: 6px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
        
        .input-area { background: #1e293b; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #334155; }
        .input-area input { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 10px 14px; color: white; font-size: 0.95rem; outline: none; }
        .input-area button { background: #0284c7; color: white; border: none; padding: 0 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .input-area button:active { background: #0369a1; }
    </style>
</head>
<body>

    <header>
        <h1>🤖 حجي علي AI</h1>
        <p>مساعدك الذكي الخاص - يتعلم منك ويجيبك بكل دقة</p>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">أهلاً بك يا علي! أنا جاهز، تفضل اطرح سؤالك أو اكتب لي شيئاً لأتعلمه منك.</div>
    </div>

    <!-- خانة تعليم الذكاء الاصطناعي -->
    <div class="memory-box">
        <textarea id="memoryInput" placeholder="علّم حجي علي شيئاً جديداً (مثلاً: مشروعي هو كذا وأحب كذا)..."></textarea>
        <button onclick="saveMemory()">حفظ التعليم في الذاكرة 🧠</button>
    </div>

    <div class="input-area">
        <input type="text5" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // مفتاحك السري الذي أرسلته
        const API_KEY = "AQ.Ab8RN6I8CduQOS4QpTEzeVmMey5o0YnJhXQGFNajmycOd8slXA";
        const MODEL_NAME = "gemini-1.5-flash"; // أو gemini-flash-latest

        // جلب الذاكرة المحفوظة مسبقاً من هاتفك
        let customMemory = localStorage.getItem("hajiAliMemory") || "أنت مساعد ذكي خاص بـ علي جاسم، وتتحدث باللهجة العراقية واللغة العربية الفصحى حسب الطلب.";
        
        // إذا كان هناك ذاكرة مخزنة، ضعها في مربع التعليم للتعديل عليها
        document.getElementById("memoryInput").value = customMemory;

        function saveMemory() {
            customMemory = document.getElementById("memoryInput").value;
            localStorage.setItem("hajiAliMemory", customMemory);
            alert("تم حفظ وتحديث ذاكرة حجي علي AI بنجاح! 🧠✨");
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chatContainer");
            const text = inputField.value.trim();
            
            if (!text) return;

            // عرض رسالة المستخدم
            chatContainer.innerHTML += `<div class="message user-message">${text}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // عرض رسالة مؤقتة بانتظار الرد
            const loadingId = "loading_" + Date.now();
            chatContainer.innerHTML += `<div class="message ai-message" id="${loadingId}">جاري التفكير... ⏳</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // دمج الذاكرة الشخصية التي علمته إياها مع السؤال الحالي
                const promptWithMemory = `[تعليمات الذاكرة الخاصة بي التي يجب أن تلتزم بها وتفهمها]:\n${customMemory}\n\n[سؤال المستخدم الآن]:\n${text}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptWithMemory }] }]
                    })
                });

                const data = await response.json();
                const aiMessage = data.candidates && data.candidates[0].content.parts[0].text 
                    ? data.candidates[0].content.parts[0].text 
                    : "عذراً يا علي، حدث خطأ بسيط في الاتصال بالمفتاح.";

                // إزالة رسالة التحميل ووضع رد الذكاء الاصطناعي الحقيقي
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message ai-message">${aiMessage}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message ai-message">عذراً، تأكد من الاتصال بالإنترنت أو صحة المفتاح.</div>`;
            }
        }
    </script>
</body>
</html>
